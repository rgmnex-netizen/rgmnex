    document.getElementById('file').addEventListener('change', function(e) {
      if(!e.target.files.length) return;
      
      let file = e.target.files[0];
      let userPreview = document.getElementById('userPreview');
      let tierPreview = document.getElementById('tierPreview');
      let resText = document.getElementById('resultText');
      let resultDiv = document.getElementById('result');
      let barBg = document.getElementById('barBg');
      let bar = document.getElementById('bar');
      
      userPreview.src = URL.createObjectURL(file);
      userPreview.style.display = "inline-block";
      
      resultDiv.style.display = "none";
      barBg.style.display = "block";
      bar.style.width = "0%";
      
      let w = 0;
      let timer = setInterval(() => {
        w += 3;
        bar.style.width = w + "%";
        
        if(w >= 100) {
          clearInterval(timer);
          setTimeout(() => {
            let randomIdx = Math.floor(Math.random() * tiers.length);
            let selectedTier = tiers[randomIdx];
            
            resText.innerText = `РЕЗУЛЬТАТ: ${selectedTier.name.toUpperCase()}\n\n${selectedTier.desc}`;
            tierPreview.src = selectedTier.img;
            tierPreview.style.display = "inline-block";
            
            resultDiv.style.display = "block";
            barBg.style.display = "none";
          }, 400);
        }
      }, 70);
    });
  </script>
